[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-replica"
version = "0.1.0"
description = "An agent harness that runs Claude with Claude Code-style tools and working principles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
replica = "replica.cli:main"

[tool.setuptools]
packages = ["replica"]

[tool.setuptools.package-data]
replica = ["system_prompt.md"]
